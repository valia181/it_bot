openapi: 3.1.0
info:
  title: Corporate IT Support Assistant REST API
  version: 1.0.0
  description: >
    REST API specification for the Corporate IT Support Assistant MVP.
    Decouples the core inverted-index TF-IDF retrieval engine, thread-safe short-term
    session manager, strict security guardrails, and Gemini LLM grounding pipeline
    from the Telegram Bot transport layer (REQ-NF-008).
  contact:
    name: Corporate IT Support (Fictional Escalation Contact)
    url: https://t.me/corp_it_support

servers:
  - url: https://api.corp-it-bot.local/api/v1
    description: Production / Staging HTTPS Endpoint
  - url: http://localhost:8000/api/v1
    description: Local MVP Development Server

tags:
  - name: Sessions
    description: User session lifecycle and sliding-window dialogue memory (REQ-F-001, REQ-F-006)
  - name: Messages
    description: Query validation, classification, grounded LLM answering, security refusals, and fallback handling (REQ-F-002, REQ-F-007..REQ-F-012)
  - name: KnowledgeBase
    description: Sandboxed read-only access to knowledge_base/ documents and TF-IDF Top-3 search (REQ-F-004, REQ-F-005, REQ-NF-001, REQ-NF-007)
  - name: Index
    description: Thread-safe multithreaded inverted index inspection and rebuild operations (REQ-F-003, REQ-NF-003, REQ-NF-004)
  - name: Verification
    description: Automated 10-case verification suite execution and reporting (REQ-F-013, REQ-NF-008)

paths:
  /sessions:
    post:
      tags:
        - Sessions
      summary: Initialize or reset a user dialogue session
      description: >
        Creates a new empty session for the specified session_id (Telegram chat_id)
        or resets an existing session's sliding context window, returning the Ukrainian
        welcome message (REQ-F-001, REQ-F-006).
      operationId: initializeSession
      x-req-ids:
        - REQ-F-001
        - REQ-F-006
        - REQ-NF-004
        - REQ-NF-006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionInitRequest'
      responses:
        '201':
          description: Session initialized or reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInitResponse'
        '400':
          description: Malformed JSON payload or invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected internal server failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /sessions/{session_id}:
    get:
      tags:
        - Sessions
      summary: Retrieve active session context and TTL state
      description: >
        Returns the active session's sliding window of up to 6 recent dialogue turns
        and remaining time-to-live (TTL up to 900 seconds). Expired sessions are
        automatically evicted (REQ-F-006, REQ-NF-004).
      operationId: getSession
      x-req-ids:
        - REQ-F-006
        - REQ-NF-004
      parameters:
        - name: session_id
          in: path
          required: true
          description: Unique identifier of the user conversation session (maps to Telegram chat_id)
          schema:
            type: string
            minLength: 1
            maxLength: 64
            examples:
              - "1001"
      responses:
        '200':
          description: Active session state retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResource'
        '404':
          description: Requested session was not found or expired via TTL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected internal server failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

    delete:
      tags:
        - Sessions
      summary: Clear user session history
      description: >
        Explicitly clears all stored dialogue turns for the given session_id,
        corresponding to /start or /reset commands (REQ-F-001, REQ-F-006).
      operationId: resetSession
      x-req-ids:
        - REQ-F-001
        - REQ-F-006
        - REQ-NF-004
      parameters:
        - name: session_id
          in: path
          required: true
          description: Unique identifier of the user conversation session (maps to Telegram chat_id)
          schema:
            type: string
            minLength: 1
            maxLength: 64
            examples:
              - "1001"
      responses:
        '204':
          description: Session history cleared successfully
        '404':
          description: Requested session was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected internal server failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /messages:
    post:
      tags:
        - Messages
      summary: Process a user message and generate a grounded IT support response
      description: >
        Validates that the incoming payload is text-only (REQ-F-002), applies
        adversarial/security screening without recording hostile inputs to session
        memory (REQ-F-010, REQ-F-011), performs TF-IDF Top-3 retrieval (REQ-F-004,
        REQ-F-005), invokes Gemini API with temperature=0 and 10s timeout (REQ-F-007,
        REQ-F-008, REQ-F-009, REQ-NF-002, REQ-NF-005), or executes graceful fallback
        attaching Top-3 documents on Gemini outage (REQ-F-012).
      operationId: processMessage
      x-req-ids:
        - REQ-F-002
        - REQ-F-004
        - REQ-F-005
        - REQ-F-006
        - REQ-F-007
        - REQ-F-008
        - REQ-F-009
        - REQ-F-010
        - REQ-F-011
        - REQ-F-012
        - REQ-NF-002
        - REQ-NF-004
        - REQ-NF-005
        - REQ-NF-006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomingMessageRequest'
      responses:
        '200':
          description: >
            Message processed. Covers in-scope answers, ambiguous query clarifications,
            out-of-scope escalation to @corp_it_support, security hard refusals, and
            Gemini API outage fallback responses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotMessageResponse'
        '400':
          description: Malformed JSON payload or invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Non-text payload rejected at input validation stage (REQ-F-002)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                error_code: NON_TEXT_PAYLOAD_UNSUPPORTED
                message: "Перепрошую, наразі моя функціональність обмежується лише текстовими повідомленнями. Будь ласка, опишіть ваше ІТ-питання текстом."
                details:
                  - field: payload_type
                    issue: "Unsupported payload type 'photo'; only 'text' is accepted."
                    constraint: "payload_type == 'text'"
                req_id: REQ-F-002
                timestamp: "2026-11-25T10:56:00Z"
                trace_id: "7f9c2e10-4b1a-4c9d-9e2a-112233445566"
        '503':
          description: Inverted index is not yet initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected internal server failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /knowledge-base/documents:
    get:
      tags:
        - KnowledgeBase
      summary: List all indexed instructions in knowledge_base/
      description: >
        Returns metadata for all .md and .txt instruction files located inside
        the sandboxed knowledge_base/ directory (REQ-F-003, REQ-NF-001, REQ-NF-007).
      operationId: listKnowledgeDocuments
      x-req-ids:
        - REQ-F-003
        - REQ-NF-001
        - REQ-NF-007
      responses:
        '200':
          description: List of sandboxed knowledge base documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeDocumentListResponse'
        '500':
          description: Unexpected internal server failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /knowledge-base/documents/{document_id}:
    get:
      tags:
        - KnowledgeBase
      summary: Retrieve full text of a specific knowledge base document
      description: >
        Reads and returns a single instruction file from knowledge_base/. Enforces
        canonical path confinement and blocks any path traversal attempts such as
        '../.env' (REQ-NF-001, REQ-F-012).
      operationId: getKnowledgeDocument
      x-req-ids:
        - REQ-F-012
        - REQ-NF-001
      parameters:
        - name: document_id
          in: path
          required: true
          description: Filename of the instruction inside knowledge_base/ (e.g., printer_issues.md)
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_-]+\.(md|txt)$'
            examples:
              - printer_issues.md
      responses:
        '200':
          description: Document content retrieved from sandboxed directory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeDocumentDetail'
        '403':
          description: Path traversal or access outside knowledge_base/ blocked (REQ-NF-001)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Requested knowledge base document was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected internal server failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /knowledge-base/search:
    post:
      tags:
        - KnowledgeBase
      summary: Execute normalized TF-IDF search for Top-3 documents
      description: >
        Applies lowercase normalization, punctuation stripping, Ukrainian stop-word
        filtering, and rule-based stemming (REQ-F-004), then ranks documents by TF-IDF
        score and returns up to Top-3 documents with score > 0 (REQ-F-005).
      operationId: searchKnowledgeBase
      x-req-ids:
        - REQ-F-004
        - REQ-F-005
        - REQ-NF-001
        - REQ-NF-004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchQueryRequest'
      responses:
        '200':
          description: Ranked Top-3 documents (or empty list if all scores equal 0)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchQueryResponse'
        '400':
          description: Malformed JSON payload or invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: Inverted index is not yet initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Unexpected internal server failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /index:
    get:
      tags:
        - Index
      summary: Get inverted index status and build metrics
      description: >
        Returns thread-safe status metrics of the in-memory inverted index, including
        indexed document count, unique stem count, and last build duration in milliseconds
        (REQ-F-003, REQ-NF-003, REQ-NF-004).
      operationId: getIndexStatus
      x-req-ids:
        - REQ-F-003
        - REQ-NF-003
        - REQ-NF-004
      responses:
        '200':
          description: Inverted index status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvertedIndexStatus'
        '500':
          description: Unexpected internal server failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /index/rebuild:
    post:
      tags:
        - Index
      summary: Rebuild inverted index from knowledge_base/ using ThreadPoolExecutor
      description: >
        Re-scans knowledge_base/ in parallel using ThreadPoolExecutor under RLock
        protection to pick up newly added or edited .md/.txt instruction files without
        code changes (REQ-F-003, REQ-NF-003, REQ-NF-004, REQ-NF-007).
      operationId: rebuildIndex
      x-req-ids:
        - REQ-F-003
        - REQ-NF-001
        - REQ-NF-003
        - REQ-NF-004
        - REQ-NF-007
      responses:
        '200':
          description: Inverted index rebuilt successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvertedIndexStatus'
        '500':
          description: Unexpected internal server failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /verification/runs:
    post:
      tags:
        - Verification
      summary: Execute the automated 10-question verification suite
      description: >
        Runs all 10 control test cases (5 in-scope, 1 multi-turn ambiguous, 1 out-of-scope,
        3 adversarial/prompt-injection cases, plus Gemini outage fallback verification)
        without live Telegram servers and returns a structured pass/fail report
        (REQ-F-013, REQ-NF-008).
      operationId: runVerificationSuite
      x-req-ids:
        - REQ-F-013
        - REQ-NF-008
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRunRequest'
      responses:
        '200':
          description: Verification suite executed and report generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRunReport'
        '500':
          description: Unexpected internal server failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

components:
  schemas:
    SessionCommand:
      type: string
      enum:
        - /start
        - /reset
        - /help
      description: Telegram command that triggered session initialization or reset

    DialogueRole:
      type: string
      enum:
        - user
        - assistant
      description: Participant role in the dialogue turn

    PayloadType:
      type: string
      enum:
        - text
        - photo
        - sticker
        - voice
        - video
        - audio
        - document
      description: Type of incoming user message payload (only 'text' is valid per REQ-F-002)

    QueryClassification:
      type: string
      enum:
        - IN_SCOPE_ANSWER
        - CLARIFICATION_NEEDED
        - OUT_OF_SCOPE_ESCALATION
        - SECURITY_HARD_REFUSAL
        - API_FALLBACK_DOCUMENTS
      description: Outcome category assigned by the query processing pipeline

    DocumentFormat:
      type: string
      enum:
        - md
        - txt
      description: Supported instruction file extension in knowledge_base/

    IndexBuildStatus:
      type: string
      enum:
        - READY
        - BUILDING
      description: Current availability state of the in-memory inverted index

    VerificationCaseCategory:
      type: string
      enum:
        - IN_SCOPE
        - AMBIGUOUS_MULTI_TURN
        - OUT_OF_SCOPE
        - ADVERSARIAL
        - API_FALLBACK
      description: Test case category within the 10-question verification suite

    ApiErrorCode:
      type: string
      enum:
        - NON_TEXT_PAYLOAD_UNSUPPORTED
        - VALIDATION_ERROR
        - PATH_TRAVERSAL_DENIED
        - DOCUMENT_NOT_FOUND
        - SESSION_NOT_FOUND
        - INDEX_NOT_READY
        - INTERNAL_SERVER_ERROR
      description: Machine-readable canonical error code

    SessionInitRequest:
      type: object
      required:
        - session_id
      properties:
        session_id:
          type: string
          minLength: 1
          maxLength: 64
          description: Unique user chat identifier (e.g., Telegram chat_id)
          examples:
            - "1001"
        command:
          $ref: '#/components/schemas/SessionCommand'

    SessionInitResponse:
      type: object
      required:
        - session_id
        - welcome_message
        - max_turns
        - ttl_seconds
      properties:
        session_id:
          type: string
          examples:
            - "1001"
        welcome_message:
          type: string
          description: Greeting message in Ukrainian inviting the user to ask an IT question
          examples:
            - "Вітаю! Я корпоративний ІТ-помічник. Опишіть вашу технічну проблему текстом, і я знайду відповідь у базі знань."
        max_turns:
          type: integer
          const: 6
          description: Maximum sliding-window capacity in dialogue turns (REQ-F-006)
          examples:
            - 6
        ttl_seconds:
          type: integer
          const: 900
          description: Session inactivity expiration timeout in seconds (15 minutes)
          examples:
            - 900

    DialogueTurn:
      type: object
      required:
        - role
        - content
        - timestamp
      properties:
        role:
          $ref: '#/components/schemas/DialogueRole'
        content:
          type: string
          description: Text content of the turn in Ukrainian
        timestamp:
          type: string
          format: date-time
          description: UTC timestamp when the turn was recorded

    SessionResource:
      type: object
      required:
        - session_id
        - turns
        - turn_count
        - max_turns
        - remaining_ttl_seconds
      properties:
        session_id:
          type: string
          examples:
            - "1001"
        turns:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/DialogueTurn'
          description: Active sliding context window (up to 6 most recent turns)
        turn_count:
          type: integer
          minimum: 0
          maximum: 6
          examples:
            - 2
        max_turns:
          type: integer
          const: 6
          examples:
            - 6
        remaining_ttl_seconds:
          type: integer
          minimum: 0
          maximum: 900
          description: Remaining seconds before automatic TTL eviction
          examples:
            - 842

    IncomingMessageRequest:
      type: object
      required:
        - session_id
        - payload_type
      properties:
        session_id:
          type: string
          minLength: 1
          maxLength: 64
          description: Unique user chat identifier
          examples:
            - "1001"
        payload_type:
          $ref: '#/components/schemas/PayloadType'
        text:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 4000
          description: User question in Ukrainian (required when payload_type is 'text', null for non-text payloads)
          examples:
            - "Що робити, якщо в офісі зажувало папір у принтері?"

    DocumentAttachment:
      type: object
      required:
        - document_id
        - title
        - content
        - tfidf_score
      properties:
        document_id:
          type: string
          examples:
            - "printer_issues.md"
        title:
          type: string
          examples:
            - "Несправності мережевого принтера"
        content:
          type: string
          description: Full text of the instruction file sent as a document during Gemini API fallback (REQ-F-012)
        tfidf_score:
          type: number
          format: float
          minimum: 0.0001
          examples:
            - 1.4821

    BotMessageResponse:
      type: object
      required:
        - session_id
        - classification
        - reply_text
        - context_updated
        - matched_documents
        - attachments
        - escalation_contact
      properties:
        session_id:
          type: string
          examples:
            - "1001"
        classification:
          $ref: '#/components/schemas/QueryClassification'
        reply_text:
          type: string
          description: Concise Ukrainian response generated strictly from KB, clarification prompt, escalation notice, or security refusal
          examples:
            - "1. Вимкніть принтер кнопкою живлення. 2. Обережно витягніть застряглий папір у напрямку його руху. 3. Перевірте лоток і увімкніть пристрій."
        context_updated:
          type: boolean
          description: False when an adversarial query is blocked so session memory remains unpolluted (REQ-F-011)
          examples:
            - true
        matched_documents:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/RankedDocumentHit'
          description: Top-3 documents selected by TF-IDF ranking (empty for adversarial refusals or zero-match queries)
        attachments:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/DocumentAttachment'
          description: Populated with Top-3 files ONLY when classification is API_FALLBACK_DOCUMENTS (REQ-F-012)
        escalation_contact:
          type:
            - string
            - "null"
          description: Set to '@corp_it_support' ONLY for OUT_OF_SCOPE_ESCALATION; null for SECURITY_HARD_REFUSAL (REQ-F-009, REQ-F-010)
          examples:
            - null

    KnowledgeDocumentSummary:
      type: object
      required:
        - document_id
        - title
        - format
        - token_count
      properties:
        document_id:
          type: string
          examples:
            - "lost_phone.md"
        title:
          type: string
          examples:
            - "Втрата корпоративного телефону"
        format:
          $ref: '#/components/schemas/DocumentFormat'
        token_count:
          type: integer
          minimum: 0
          examples:
            - 84

    KnowledgeDocumentListResponse:
      type: object
      required:
        - total_documents
        - documents
      properties:
        total_documents:
          type: integer
          minimum: 0
          examples:
            - 7
        documents:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeDocumentSummary'

    KnowledgeDocumentDetail:
      type: object
      required:
        - document_id
        - title
        - format
        - content
      properties:
        document_id:
          type: string
          examples:
            - "lost_phone.md"
        title:
          type: string
          examples:
            - "Втрата корпоративного телефону"
        format:
          $ref: '#/components/schemas/DocumentFormat'
        content:
          type: string
          description: Raw UTF-8 text content of the instruction file

    SearchQueryRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 2000
          description: Raw Ukrainian search query
          examples:
            - "загубив робочий телефон у метро"
        top_k:
          type: integer
          minimum: 1
          maximum: 3
          default: 3
          description: Maximum number of top documents to retrieve (capped at 3 per REQ-F-005)

    RankedDocumentHit:
      type: object
      required:
        - document_id
        - title
        - tfidf_score
        - matched_stems
      properties:
        document_id:
          type: string
          examples:
            - "lost_phone.md"
        title:
          type: string
          examples:
            - "Втрата корпоративного телефону"
        tfidf_score:
          type: number
          format: float
          minimum: 0.0001
          description: Positive TF-IDF relevance score (zero-score documents are excluded)
          examples:
            - 1.9345
        matched_stems:
          type: array
          items:
            type: string
          examples:
            - - "телефон"
              - "втрат"

    SearchQueryResponse:
      type: object
      required:
        - normalized_stems
        - results
      properties:
        normalized_stems:
          type: array
          items:
            type: string
          description: Stems produced after lowercasing, punctuation removal, stop-word filtering, and Ukrainian rule-based stemming (REQ-F-004)
          examples:
            - - "загуб"
              - "робоч"
              - "телефон"
              - "метр"
        results:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/RankedDocumentHit'

    InvertedIndexStatus:
      type: object
      required:
        - status
        - indexed_documents
        - unique_stems
        - build_duration_ms
        - worker_threads
      properties:
        status:
          $ref: '#/components/schemas/IndexBuildStatus'
        indexed_documents:
          type: integer
          minimum: 0
          examples:
            - 7
        unique_stems:
          type: integer
          minimum: 0
          examples:
            - 312
        build_duration_ms:
          type: number
          format: float
          minimum: 0
          description: Elapsed time in milliseconds for parallel index construction (must be < 2000 ms for <= 1000 files per REQ-NF-003)
          examples:
            - 18.4
        worker_threads:
          type: integer
          minimum: 1
          examples:
            - 4

    VerificationRunRequest:
      type: object
      properties:
        include_fallback_simulation:
          type: boolean
          default: true
          description: Whether to also run the Gemini API timeout/outage fallback check alongside the 10 control questions

    VerificationCaseResult:
      type: object
      required:
        - case_id
        - category
        - question
        - expected_classification
        - actual_classification
        - actual_response
        - passed
      properties:
        case_id:
          type: integer
          minimum: 1
          maximum: 11
          examples:
            - 1
        category:
          $ref: '#/components/schemas/VerificationCaseCategory'
        question:
          type: string
          examples:
            - "Скинь пароль директора"
        expected_classification:
          $ref: '#/components/schemas/QueryClassification'
        actual_classification:
          $ref: '#/components/schemas/QueryClassification'
        actual_response:
          type: string
        passed:
          type: boolean
          examples:
            - true

    VerificationRunReport:
      type: object
      required:
        - total_cases
        - passed_cases
        - failed_cases
        - executed_at
        - results
      properties:
        total_cases:
          type: integer
          examples:
            - 10
        passed_cases:
          type: integer
          examples:
            - 10
        failed_cases:
          type: integer
          examples:
            - 0
        executed_at:
          type: string
          format: date-time
        results:
          type: array
          items:
            $ref: '#/components/schemas/VerificationCaseResult'

    ErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          examples:
            - "payload_type"
        issue:
          type: string
          examples:
            - "Only text payloads are supported."
        constraint:
          type:
            - string
            - "null"
          description: Validation constraint expression if applicable, or null
          examples:
            - "payload_type == 'text'"

    ApiErrorResponse:
      type: object
      required:
        - error_code
        - message
        - details
        - req_id
        - timestamp
        - trace_id
      properties:
        error_code:
          $ref: '#/components/schemas/ApiErrorCode'
        message:
          type: string
          description: User-facing error message strictly in Ukrainian (REQ-NF-006)
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        req_id:
          type: string
          description: Traceability link to the governing SRS requirement ID
          examples:
            - "REQ-F-002"
        timestamp:
          type: string
          format: date-time
        trace_id:
          type: string
          format: uuid
